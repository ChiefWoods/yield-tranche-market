[package]
name = "yield-tranche-market"
version.workspace = true
edition.workspace = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']

[lib]
crate-type = ["cdylib"]

[features]
alloc = []
client = []
debug = []
idl-build = ["quasar-lang/idl-build"]

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", branch = "master" }
quasar-spl = { git = "https://github.com/blueshift-gg/quasar", branch = "master" }
solana-instruction = { version = "3.2.0" }
solana-math = { workspace = true, features = ["quasar"] }
solmath.workspace = true
zeropod = "=0.3.3"
fix.workspace = true
yield-tranche-market-core = { path = "../../crates/yield-tranche-market-core" }

[dev-dependencies]
base64 = "0.22"
quasar-svm = { version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = { version = "3.4.0" }
solana-address = { version = "2.2.0", features = ["curve25519", "decode"] }
solana-instruction = { version = "3.2.0", features = ["bincode"] }
solana-program-pack = "3.1.0"
solana-pubkey = { version = "4.1.0" }
wincode = { version = "=0.4.9", features = ["derive"] }
yield_tranche_market-client = { path = "../../target/client/rust/yield_tranche_market-client" }
